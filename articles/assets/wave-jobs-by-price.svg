  <text x="30" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#4a5a6d">Prices and SLAs as listed on Virtuals Protocol (ACP), as recorded 2026-11-06. Require Funds is ON for every job.</text>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#14202e">
    <text x="30" y="96">sound_clip_id — $1 · 5 min</text>
