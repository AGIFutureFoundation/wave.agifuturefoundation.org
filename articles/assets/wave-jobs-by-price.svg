<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Bar chart of WAVE's six ACP jobs by fixed USD price">
  <rect width="720" height="360" fill="#ffffff"/>
