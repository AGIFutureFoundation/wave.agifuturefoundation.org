    <rect x="270" y="158" width="72" height="18" fill="#0e7c7b"/>
    <text x="30" y="210">animal_voice_dataset — $25 · 48 h</text>
    <rect x="270" y="196" width="120" height="18" fill="#0e7c7b"/>
